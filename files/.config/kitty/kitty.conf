# ~/.config/kitty/kitty.conf
background_opacity 0.50
dynamic_background_opacity yes  # Allows adjusting opacity with keybindings

# Keybindings to adjust opacity
map ctrl+shift+o background_opacity +0.05
map ctrl+shift+i background_opacity -0.05

# deck-aero: KWin only blurs windows that ask for it (Hyprland blurred everything)
background_blur 1
